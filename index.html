<script>
  const recorded = JSON.parse(document.getElementById('showcase-results').textContent);
  const standardFetch = window.fetch.bind(window);
  window.fetch = function(input, options) {
    const url = new URL(typeof input === 'string' ? input : (input.url || input.href), location.href);
    if (url.pathname.endsWith('/api/search')) {
      let selected = {};
      try { selected = JSON.parse(options?.body || '{}').input || {}; } catch {}
      const preset = recorded.output.query;
      const toAll = (value) => typeof value === 'string' && value.startsWith('All') ? 'All' : value;
      const fields = ['crew_environment','fire_safety_category','research_topic','investigation','fuel_type','measurement_type'];
      const conditions = selected.conditions || {};
      const matches = fields.every(field => toAll(selected[field]) === preset[field])
          && conditions.oxygen_pct === preset.conditions.oxygen_pct
          && conditions.pressure_kpa == null && conditions.airflow_cm_s == null
          && (conditions.gravity_level == null || conditions.gravity_level === 'All');
      const result = { ...recorded, meta: { ...recorded.meta, query_matches_example: matches } };
      return Promise.resolve(new Response(JSON.stringify(result), { headers: {'Content-Type':'application/json'} }));
    }
    return standardFetch(input, options);
  };
  window.addEventListener('DOMContentLoaded', () => {
    const showCue = () => {
      const form = document.querySelector('main form');
      if (!form || form.querySelector('[data-showcase-cue]')) return;
      const cue = document.createElement('p');
      cue.dataset.showcaseCue = '';
      cue.className = 'rounded-lg border border-line bg-faint px-4 py-3 text-sm text-navy';
      cue.textContent = 'Demo scenario: Lunar Base · Liquid Fuels · Burning Rate. In Advanced Conditions, enter 30% oxygen.';
      form.children[0]?.after(cue);
    };
    new MutationObserver(showCue).observe(document.getElementById('root'), {childList:true,subtree:true});
    showCue();
  });
</script>
